<html lang="en">
<style>
    .container {
        margin: 40px auto;
        width: 80%;
    }
    .button {
        width: 160px;
        height: 45px;
        border-radius: 6px;
        font-size: 15px;
        margin-top: 20px;
    }
    img {
        width: 328px;
        height: 287px;
        display: block;
        margin-bottom: 20px;
    }
    hr {
        width: 400px;
        margin-left: 0;
    }
    h3 {
        display: inline-block;
    }
    #container {
        display: none;
    }
</style>
<script>
  (async function init() {
    const response = await fetch('/get-data');
    console.log("response", response);
    const data = await response.json();
    console.log("stringified data: " + JSON.stringify(data));

    let element = document.getElementById('member-roles');
    data.forEach(user => {
      let li = document.createElement('li');
      let spanName = document.createElement('span');
      let spanSpace = document.createElement('span');
      let spanRole = document.createElement('span');

      spanRole.setAttribute("id", `role-${user.name}`);
      spanName.setAttribute("class", "name");
      li.setAttribute("class", "member-role");

      spanName.innerText = user.name;
      spanSpace.innerText = ": ";
      spanRole.innerText = user.role;

      li.appendChild(spanName);
      li.appendChild(spanSpace);
      li.appendChild(spanRole);
      element.appendChild(li);


    });

    const cont = document.getElementById('container');
    cont.style.display = 'block';
  })();


</script>
<body>
<div>
    <h1>Team member roles</h1>
    <img src='/static/team.jpg' alt="team members">
</div>

<div class='container' id='container'>
    <ul id="member-roles"></ul>
</div>
</body>
</html>
